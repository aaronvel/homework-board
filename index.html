<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="kicker">Family board</p>
      <h1>Homework</h1>
    </div>
    <p class="updated" id="updated">Loading…</p>
  </header>

  <section class="pickup" id="pickup" aria-label="Pickup times"></section>

  <nav class="tabs" role="tablist" aria-label="Board sections">
    <button type="button" role="tab" id="tab-homework" aria-controls="panel-homework" aria-selected="true" data-tab="homework">Homework</button>
    <button type="button" role="tab" id="tab-activities" aria-controls="panel-activities" aria-selected="false" data-tab="activities">Activities</button>
  </nav>

  <div class="filters" id="kid-filters"></div>

  <main>
    <section id="panel-homework" role="tabpanel" aria-labelledby="tab-homework"></section>
    <section id="panel-activities" role="tabpanel" aria-labelledby="tab-activities" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
